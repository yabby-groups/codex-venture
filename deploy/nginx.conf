server {
    listen 8080;
    server_name _;
    root /srv/venture/current;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/xml application/json image/svg+xml application/wasm;
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /release.txt {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        try_files /404.html =404;
    }
}
